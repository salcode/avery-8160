<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Avery 8160</title>
	<style>
		:root {
			--bg: #ffffff;
			--fg: #1a1a1a;
			--muted: #666666;
			--border: #cccccc;
			--accent: #2563eb;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #121212;
				--fg: #eeeeee;
				--muted: #999999;
				--border: #444444;
				--accent: #60a5fa;
			}
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			padding: 16px;
			background: var(--bg);
			color: var(--fg);
			font-family: system-ui, -apple-system, sans-serif;
			line-height: 1.5;
		}
		main { max-width: 960px; margin: 0 auto; }
		label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
		.hint { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.5rem; }
		textarea {
			width: 100%;
			min-height: 16rem;
			padding: 0.75rem;
			font-family: ui-monospace, Menlo, monospace;
			font-size: 0.9rem;
			color: var(--fg);
			background: var(--bg);
			border: 1px solid var(--border);
			border-radius: 6px;
			resize: vertical;
			tab-size: 4;
		}
		textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
		.status { color: var(--muted); font-size: 0.9rem; margin: 0.5rem 0 1rem; }
		.table-wrap { overflow-x: auto; }
		table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
		th, td { border: 1px solid var(--border); padding: 0.35rem 0.5rem; text-align: left; vertical-align: top; }
		th { font-weight: 600; }
	</style>
</head>
<body>
	<main>
		<h1>Avery 8160</h1>

		<label for="sheet-data">Spreadsheet data</label>
		<p class="hint">Select cells in Google Sheets, copy (⌘C / Ctrl+C), and paste them below.</p>
		<textarea id="sheet-data" spellcheck="false" placeholder="Paste spreadsheet cells here…"></textarea>

		<p class="status" id="status">No data yet.</p>

		<div class="table-wrap">
			<table id="preview" hidden></table>
		</div>
	</main>

	<script>
		const textarea = document.getElementById('sheet-data');
		const status = document.getElementById('status');
		const preview = document.getElementById('preview');

		/**
		 * Parse tab-separated text as copied from Google Sheets.
		 * Handles quoted cells, which Sheets uses for cells containing
		 * newlines, tabs, or quotes ("" is an escaped quote).
		 */
		function parseTsv(text) {
			const rows = [];
			let row = [];
			let cell = '';
			let inQuotes = false;

			for (let i = 0; i < text.length; i++) {
				const ch = text[i];

				if (inQuotes) {
					if (ch === '"') {
						if (text[i + 1] === '"') {
							cell += '"';
							i++;
						} else {
							inQuotes = false;
						}
					} else {
						cell += ch;
					}
				} else if (ch === '"' && cell === '') {
					inQuotes = true;
				} else if (ch === '\t') {
					row.push(cell);
					cell = '';
				} else if (ch === '\n' || ch === '\r') {
					if (ch === '\r' && text[i + 1] === '\n') i++;
					row.push(cell);
					rows.push(row);
					row = [];
					cell = '';
				} else {
					cell += ch;
				}
			}

			if (cell !== '' || row.length) {
				row.push(cell);
				rows.push(row);
			}

			// Drop fully empty rows.
			return rows.filter((r) => r.some((c) => c.trim() !== ''));
		}

		function render() {
			const rows = parseTsv(textarea.value);
			preview.replaceChildren();

			if (!rows.length) {
				preview.hidden = true;
				status.textContent = 'No data yet.';
				return;
			}

			const cols = Math.max(...rows.map((r) => r.length));
			for (const r of rows) {
				const tr = preview.insertRow();
				for (let c = 0; c < cols; c++) {
					const td = tr.insertCell();
					td.textContent = r[c] ?? '';
					td.style.whiteSpace = 'pre-wrap';
				}
			}

			preview.hidden = false;
			status.textContent = `${rows.length} row${rows.length === 1 ? '' : 's'}, ${cols} column${cols === 1 ? '' : 's'}`;
		}

		textarea.addEventListener('input', render);
		render();
	</script>
</body>
</html>
